services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: beanscan
      POSTGRES_USER: beanscan
      POSTGRES_PASSWORD: beanscanpw
    ports: ['5432:5432']
    volumes: [postgres_data:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']

  minio:
    image: minio/minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['9000:9000', '9001:9001']
    volumes: [minio_data:/data]

  api:
    build: ../backend
    ports: ['8000:8000']
    env_file: ../.env
    depends_on: [postgres, redis, minio]
    volumes: ['../backend:/app']

  worker:
    build: ../backend
    command: sleep infinity
    env_file: ../.env
    depends_on: [redis, postgres, minio]
    volumes: ['../backend:/app']
  
  
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@beanscan.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
  minio_data: